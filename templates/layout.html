<!DOCTYPE html>
<html lang="el" class="dark" translate="no" style="color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>AstroDat Observer Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
        
    </script>
</head>
<body class="loading min-h-screen p-4 md:p-12 relative"> 
    <div id="canvas-container" class="fixed inset-0 top-0 left-0 w-screen h-screen z-0 pointer-events-none"></div>

    <div id="intro-loader" aria-hidden="true">
        <div class="logo-wrap animation-logo" id="logo">
            <span>ASTRO</span><span class="dat">DAT</span><span class="pro">PRO</span>
        </div>
    </div>
    <div id="main-wrapper" class="max-w-6xl mx-auto relative z-10" style="position: relative;">
            <header class="flex flex-col md:flex-row items-center justify-between gap-8 mb-16">
                <div class="flex-shrink-0">
                    <h1 class="text-3xl font-light tracking-[0.2em] text-white">
                        ASTRO<span class="text-indigo-500 font-semibold">DAT</span>PRO
                    </h1>
                    <p class="text-[10px] text-slate-500 tracking-[0.3em] uppercase">Deep Sky Observation Log</p>
                </div>
            
                <div class="flex-1 max-w-xl w-full relative group">
                    <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="search" 
                        name="q" 
                        placeholder="Search database..." 
                        class="w-full bg-white/5 border border-white/10 p-3 pl-12 rounded-full text-sm font-light outline-none focus:border-indigo-500/50 focus:bg-white/[0.07] transition-all"
                        hx-get="/search" 
                        hx-trigger="keyup changed delay:500ms, search" 
                        hx-target="#target-list" 
                        hx-indicator="#search-spinner">
                    
                    <div id="search-spinner" class="htmx-indicator absolute right-4 top-3">
                        <div class="w-4 h-4 border-2 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
                    </div>
                </div>
            
                <div class="flex flex-col items-end gap-1">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
                        <span class="font-mono text-[10px] tracking-widest text-slate-400">SYSTEM LIVE</span>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-[9px] text-slate-600 uppercase tracking-widest">Records</span>
                        <span class="text-xl font-mono font-light text-indigo-400">
                            {{ total_count | compact_number }}
                        </span>
                    </div>
                </div>
                
            </header>
            
            {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='intro.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. SETUP ENVIRONMENT
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        camera.position.z = 5.0; // Pulled back slightly to frame the tilted scene
        camera.position.y = 1.8; // Raised up higher (Increase this number for a steeper top-down view)
        camera.lookAt(0, 0, -2);  // CRITICAL: Forces the camera to tilt downward at the black hole 

        // Perfectly round, soft particle texture
        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 16, 16);
            return new THREE.CanvasTexture(canvas);
        }
        const starTexture = createStarTexture();

        // ==========================================
        // 2. CRISP BACKGROUND STARS
        // ==========================================
        const starCount = 80000;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount; i++) {
            // Distribute stars randomly in a large cube far away from the camera
            starPositions[i * 3]     = (Math.random() - 0.5) * 40;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 40;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 20 - 15; // Kept far back

            // Varying star brightness (realism multiplier)
            const brightness = Math.random() * 0.4 + 0.8; // Forces the random math to pick much higher base brightness levels
            starColors[i * 3]     = brightness;
            starColors[i * 3 + 1] = brightness * 0.98; // Subtle natural variations
            starColors[i * 3 + 2] = brightness * 1.05;
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starMaterial = new THREE.PointsMaterial({
            size: 0.03, // Increased size so they stand out against the dark background
            vertexColors: true,
            transparent: true,
            opacity: 1.0, // Force full, un-faded brightness
            map: starTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const starField = new THREE.Points(starGeometry, starMaterial);
        scene.add(starField);

        // ==========================================
        // 3. REFINED FOREGROUND ACCRETION DISK
        // ==========================================
        const particleCount = 300000;
        const diskGeometry = new THREE.BufferGeometry();
        const diskPositions = new Float32Array(particleCount * 3);
        const diskColors = new Float32Array(particleCount * 3);

        const diskHot = new THREE.Color('#ffaa00');  
        const diskMid = new THREE.Color('#ff2200');  
        const diskOuter = new THREE.Color('#1f001f'); 

        for(let i = 0; i < particleCount; i++) {
            const radius = Math.random() * 2.3 + 0.65; 
            const spin = Math.random() * Math.PI * 2;
            const thickness = (Math.random() - 0.5) * 0.03 * (radius * 0.5);

            const i3 = i * 3;
            diskPositions[i3]     = Math.cos(spin) * radius;
            diskPositions[i3 + 1] = thickness;
            diskPositions[i3 + 2] = Math.sin(spin) * radius;

            let finalColor;
            if (radius < 1.1) {
                finalColor = diskHot.clone().lerp(diskMid, (radius - 0.65) / 0.45);
            } else {
                finalColor = diskMid.clone().lerp(diskOuter, (radius - 1.1) / 1.2);
            }
            
            diskColors[i3]     = finalColor.r;
            diskColors[i3 + 1] = finalColor.g;
            diskColors[i3 + 2] = finalColor.b;
        }

        diskGeometry.setAttribute('position', new THREE.BufferAttribute(diskPositions, 3));
        diskGeometry.setAttribute('color', new THREE.BufferAttribute(diskColors, 3));

        const diskMaterial = new THREE.PointsMaterial({
            size: 0.015,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            map: starTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const accretionDisk = new THREE.Points(diskGeometry, diskMaterial);
        scene.add(accretionDisk);

        // ==========================================
        // 4. THE BLACK HOLE CORE
        // ==========================================
        const blackHoleGeo = new THREE.SphereGeometry(0.62, 32, 32);
        const blackHoleMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const blackHole = new THREE.Mesh(blackHoleGeo, blackHoleMat);
        scene.add(blackHole);

        // ==========================================
        // 5. ANIMATION LOOP
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Smooth slow rotation
            accretionDisk.rotation.y = elapsedTime * 0.02; 
            
            // Ultra subtle background drift
            starField.rotation.y = -elapsedTime * 0.001;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
