{% extends "auth_layout.html" %}

{% block auth_content %}
<section class="w-[500px] h-[500px] max-w-full premium-auth-box border border-white/[0.06] p-8 pb-10 flex flex-col justify-between rounded-2xl">
    
    <div class="text-center mt-2">
        <h1 class="text-[10px] font-bold tracking-[0.4em] text-indigo-400 uppercase mb-2">ASTRO<span class="text-white font-light">DAT</span>PRO</h1>
        <h2 class="text-2xl font-normal text-white tracking-wide">Sign In</h2>
    </div>

    <form hx-post="/login" 
          hx-target="#auth-error" 
          hx-swap="innerHTML"
          class="space-y-6">
        
        <div id="auth-error" class="text-red-400 text-xs font-semibold min-h-[1.25rem] text-center tracking-wide"></div>

        <div class="space-y-2">
            <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest pl-1">Email Address</label>
            <input type="email" name="email" required autocomplete="email"
                   placeholder="astronomer@universe.com" 
                   class="premium-input">
        </div>

        <div class="space-y-2">
            <label class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest pl-1">Password</label>
            <input type="password" name="password" required autocomplete="current-password"
                   placeholder="••••••••••••" 
                   class="premium-input">
        </div>

        <div class="pt-2">
            <button type="submit" class="premium-btn w-full py-3.5 text-center block">
                Establish Session
            </button>
        </div>
    </form>

    <div class="text-center pt-4 border-t border-white/[0.04]">
        <p class="text-xs text-slate-500 tracking-wide">
            New observer? 
            <a href="/signup" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors ml-1 underline underline-offset-4 decoration-indigo-500/30">Create Account</a>
        </p>
    </div>
</section>
{% endblock %}
