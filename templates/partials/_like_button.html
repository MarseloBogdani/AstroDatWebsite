{% set liked_ids = session.get('user_likes', []) %}
{% set is_liked = (target.id in liked_ids) or target.is_liked_by_user %}

<button type="button"
        hx-post="/like-target/{{ target.id }}"
        hx-vals='{"current_count": {{ target.likes_count }}}'
        hx-target="this"
        hx-disabled-elt="this"
        hx-swap="outerHTML"
        class="cursor-pointer flex items-center gap-1.5 p-2 {% if is_liked %}text-red-600{% else %}text-slate-500 hover:text-red-600{% endif %} transition-colors group/like active:scale-95"
        onclick="event.stopPropagation()">
    
    <svg xmlns="http://www.w3.org/2000/svg" 
         class="h-4 w-4 transition-all duration-300 group-hover/like:scale-110 
                {% if is_liked %}
                    text-red-600 animate-pop drop-shadow-[0_2px_10px_rgba(220,38,38,0.5)]
                {% else %}
                    text-slate-400 group-hover/like:text-red-500
                {% endif %}" 
         viewBox="0 0 24 24">
        <path fill="{% if is_liked %}currentColor{% else %}none{% endif %}"
              stroke="currentColor" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              stroke-width="1.5" 
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
    </svg>

    <span class="text-xs font-mono transition-colors {% if is_liked %}text-red-600 font-bold{% else %}text-slate-400 group-hover/like:text-red-500{% endif %}">
        {{ target.likes_count if target.likes_count else 0 }}
    </span>
</button>
