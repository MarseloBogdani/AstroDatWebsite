<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroDataPro - Your Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Προσαρμοσμένο στυλ για το Glassmorphism και το αστρικό background */
        body {
            background-color: #030712;
            background-image: linear-gradient(rgba(3, 6, 12, 0.88), rgba(15, 23, 42, 0.88)), 
            url('/static/images/background_resize.avif'); 
            background-size: cover; 
            background-position: center;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px border rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md z-10">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-wider text-white">
                ASTRO<span class="text-indigo-400">DATA</span>PRO
            </h1>
            <p class="text-xs text-slate-500 uppercase tracking-widest mt-1">Deep Sky Observation Log</p>
        </div>

        <section class="glass p-6 rounded-3xl border border-white/10 relative overflow-hidden shadow-2xl">
            
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex flex-col items-center text-center border-b border-white/10 pb-6">
                <div class="w-24 h-24 bg-gradient-to-tr from-indigo-600 to-purple-500 rounded-full flex items-center justify-center p-1 shadow-lg shadow-indigo-500/20 mb-4">
                    <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center overflow-hidden">
                        <span class="text-3xl font-bold text-indigo-400">U</span>
                    </div>
                </div>
                <h2 class="text-xl font-bold text-white tracking-wide">User_12345</h2>
                <p class="text-sm text-indigo-400/80 font-medium">Stargazer / Observer</p>
            </div>

            <div class="py-6 space-y-4">
                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 block mb-1">Email Address</label>
                    <div class="w-full bg-white/5 p-3.5 rounded-xl border border-white/10 text-slate-300 text-sm">
                        user_12345@example.com
                    </div>
                </div>

                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 block mb-1">Member Since</label>
                    <div class="w-full bg-white/5 p-3.5 rounded-xl border border-white/10 text-slate-300 text-sm">
                        June 2026
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 border-t border-white/10 pt-6">
                <div class="bg-white/5 border border-white/5 p-4 rounded-2xl text-center">
                    <span class="block text-2xl font-bold text-indigo-400">42</span>
                    <span class="text-xs font-medium text-slate-400">Total Logs</span>
                </div>
                <div class="bg-white/5 border border-white/5 p-4 rounded-2xl text-center">
                    <span class="block text-2xl font-bold text-purple-400">12</span>
                    <span class="text-xs font-medium text-slate-400">Exoplanets</span>
                </div>
            </div>

        </section>

        <div class="mt-4 glass p-1.5 rounded-2xl flex items-center justify-between text-center border border-white/10 shadow-lg">
            <a href="/" class="flex-1 text-xs font-semibold text-indigo-400 hover:text-indigo-300 hover:bg-indigo-500/10 py-2.5 rounded-xl transition-all duration-200 drop-shadow-[0_0_8px_rgba(129,140,248,0.2)]">
                Go Back 
            </a>
            
            <div class="w-[1px] h-4 bg-white/10"></div>
            
            <a href="/settings" class="flex-1 text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/5 py-2.5 rounded-xl transition-all duration-200">
                Settings
            </a>
            
            <div class="w-[1px] h-4 bg-white/10"></div>
            
            <a href="/logout" class="flex-1 text-xs font-semibold text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 py-2.5 rounded-xl transition-all duration-200 drop-shadow-[0_0_8px_rgba(244,63,94,0.1)]">
                Logout
            </a>
        </div>

    </div>

</body>
</html>
