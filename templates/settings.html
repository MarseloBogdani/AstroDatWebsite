<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroDataPro - Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #030712;
            background-image: linear-gradient(rgba(3, 6, 12, 0.88), rgba(15, 23, 42, 0.88)), 
            url('/static/images/background_settings.avif'); 
            background-size: cover; 
            background-position: center;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<div>under constuction</div>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md z-10 my-8">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-wider text-white">
                ASTRO<span class="text-indigo-400">DATA</span>PRO
            </h1>
            <p class="text-xs text-slate-500 uppercase tracking-widest mt-1">Control Panel & Preferences</p>
        </div>

        <section class="glass p-6 rounded-3xl border border-white/10 shadow-2xl relative">
            <h2 class="text-xl font-bold mb-6 text-indigo-400 border-b border-white/10 pb-3">Settings</h2>

            <form action="/update-settings" method="POST" class="space-y-6">
                
                <div class="space-y-4">
                    <h3 class="text-xs font-semibold uppercase tracking-widest text-slate-500">Account Profile</h3>
                    
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Username</label>
                        <input type="text" name="username" value="User_12345" required 
                            class="w-full bg-white/5 p-3.5 rounded-xl border border-white/10 focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-sm text-slate-200">
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Email Address</label>
                        <input type="email" name="email" value="user_12345@example.com" required 
                            class="w-full bg-white/5 p-3.5 rounded-xl border border-white/10 focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-sm text-slate-200">
                    </div>
                </div>

                <div class="space-y-4 pt-4 border-t border-white/5">
                    <h3 class="text-xs font-semibold uppercase tracking-widest text-slate-500">Security</h3>
                    
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">New Password (leave blank to keep current)</label>
                        <input type="password" name="password" placeholder="••••••••" 
                            class="w-full bg-white/5 p-3.5 rounded-xl border border-white/10 focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-sm text-slate-200">
                    </div>
                </div>

                <div class="space-y-4 pt-4 border-t border-white/5">
                    <h3 class="text-xs font-semibold uppercase tracking-widest text-slate-500">Observing Preferences</h3>
                    
                    <div class="flex items-center justify-between bg-white/5 p-3.5 rounded-xl border border-white/10">
                        <span class="text-sm text-slate-300">Enable Deep Sky Glow effects</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" name="glow_effects" checked class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-400 after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600 peer-checked:after:bg-white"></div>
                        </label>
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Default Coordinate Format</label>
                        <select name="coord_format" class="w-full bg-slate-900 p-3.5 rounded-xl border border-white/10 focus:ring-2 focus:ring-indigo-500 outline-none transition-all text-sm text-slate-300">
                            <option value="hms_dms" selected>RA (HMS) / Dec (DMS)</option>
                            <option value="decimal">Decimal Degrees</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold transition-all shadow-lg shadow-indigo-500/20 mt-2 text-sm uppercase tracking-wider">
                    Save Changes
                </button>
            </form>
        </section>

        <div class="mt-4 glass p-1.5 rounded-2xl flex items-center justify-between text-center border border-white/10 shadow-lg">
            <a href="/" class="flex-1 text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/5 py-2.5 rounded-xl transition-all duration-200">
                Dashboard
            </a>
            
            <div class="w-[1px] h-4 bg-white/10"></div>
            
            <a href="/profile" class="flex-1 text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/5 py-2.5 rounded-xl transition-all duration-200">
                Profile
            </a>
            
            <div class="w-[1px] h-4 bg-white/10"></div>
            
            <a href="/logout" class="flex-1 text-xs font-semibold text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 py-2.5 rounded-xl transition-all duration-200 drop-shadow-[0_0_8px_rgba(244,63,94,0.1)]">
                Logout
            </a>
        </div>

    </div>

</body>
</html>
